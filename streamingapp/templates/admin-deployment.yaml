{{- $s := .Values.services.admin }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
spec:
  replicas: {{ $s.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:
      containers:
        - name: admin
          image: "{{ $s.image }}:{{ $s.tag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ $s.port }}
          env:
            - name: PORT
              value: "{{ $s.port }}"
          envFrom:
            - configMapRef:
                name: streamingapp-config
            - secretRef:
                name: streamingapp-secret
          readinessProbe:
            tcpSocket:
              port: {{ $s.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: {{ $s.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
